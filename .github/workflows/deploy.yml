name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mufied-n/hotel-fe

jobs:
  # ============================================================================
  # Tahap 1: Quality Gate & Test (Lint, Typecheck, Unit Tests)
  # ============================================================================
  test:
    name: Test & Lint Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Nuxt definitions
        run: npm run prepare

      - name: Run ESLint
        run: npm run lint

      - name: Run Nuxt Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test:unit

  # ============================================================================
  # Tahap 2: Build & Push Docker Image ke GitHub Container Registry (GHCR)
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Tahap 3: Continuous Deployment ke VPS via SSH
  # ============================================================================
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute remote deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/opt/hotel-fe"

            echo "==> Memverifikasi direktori aplikasi di ${APP_DIR}..."
            if [ ! -d "${APP_DIR}" ]; then
              echo "Error: Direktori ${APP_DIR} belum ada di VPS. Jalankan bootstrap awal terlebih dahulu."
              exit 1
            fi

            cd "${APP_DIR}"

            echo "==> 1. Mengunduh image frontend terbaru dari GHCR..."
            docker compose -f docker-compose.prod.yml pull

            echo "==> 2. Me-restart layanan container frontend (zero-downtime update)..."
            docker compose -f docker-compose.prod.yml up -d --no-deps web

            echo "==> 3. Memeriksa status kesehatan aplikasi frontend..."
            sleep 5
            for i in {1..10}; do
              if curl -s -f http://127.0.0.1:3000/booking > /dev/null; then
                echo "Layanan frontend sehat dan siap menerima lalu lintas!"
                break
              fi
              echo "Menunggu kesiapan frontend (percobaan $i/10)..."
              sleep 2
              if [ $i -eq 10 ]; then
                echo "Error: Kesiapan frontend gagal setelah deployment!"
                docker compose -f docker-compose.prod.yml logs --tail=50 web
                exit 1
              fi
            done

            echo "==> 4. Membersihkan image lama yang tidak terpakai..."
            docker image prune -f

            echo "==> Deployment frontend berhasil diselesaikan!"
