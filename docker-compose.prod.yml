services:
  web:
    image: ghcr.io/mufied-n/hotel-fe:latest
    container_name: hotel-fe
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    extra_hosts:
      - "hotel.fied.space:95.179.243.181"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/booking || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
